[package]
name = "balai"
version = "0.1.0"
edition = "2021"
description = "Trouve ce qui remplit ton disque, vite."
license = "MIT OR Apache-2.0"

[dependencies]
anstream = "0.6"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
rayon = "1"
self-replace = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

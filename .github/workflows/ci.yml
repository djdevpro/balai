name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      # Chaque système va au bout, même si un autre échoue.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --locked

      # Le binaire démarre vraiment sur chaque système.
      - name: Smoke test
        shell: bash
        run: |
          cargo run --locked -- . -n 3
          cargo run --locked -- caches
